<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SoundShelf · Two independent players</title>
<style>body { font: 16px system-ui; max-width: 680px; margin: 60px auto; } audio { display: block; margin: 20px 0 40px; }</style>
<h1>Two players, one tab</h1>
<p>Both players should appear in SoundShelf before playback. Control one and check that the other remains paused.</p>
<audio controls preload="auto" aria-label="Low tone · ready or paused"></audio>
<audio controls preload="auto" aria-label="High tone · ready or paused"></audio>
<script>
function wav(frequency) {
  const rate = 8000, samples = rate * 12;
  const data = new ArrayBuffer(44 + samples * 2), view = new DataView(data);
  const text = (offset, value) => [...value].forEach((char, i) => view.setUint8(offset + i, char.charCodeAt(0)));
  text(0, 'RIFF'); view.setUint32(4, data.byteLength - 8, true); text(8, 'WAVE'); text(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  text(36, 'data'); view.setUint32(40, samples * 2, true);
  for (let i = 0; i < samples; i++) view.setInt16(44 + i * 2, Math.sin(i / rate * frequency * Math.PI * 2) * 1600, true);
  return URL.createObjectURL(new Blob([data], { type: 'audio/wav' }));
}
document.querySelectorAll('audio').forEach((audio, i) => { audio.src = wav(i ? 440 : 220); });
</script>
</html>
